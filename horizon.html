<style>




:root {
  color-scheme: dark;

  --bg: #0d0b12;
  --surface: #120f18;
  --surface-2: #171320;
  --line: #23202e;
  --line-soft: #1a1722;
  --track: #241f30;

  --text: #ece8f1;
  --text-muted: #b4abc4;
  --text-dim: #968da6;

  --accent: #3fc8e6;            
  --accent-text: #3fc8e6;       
  --accent-soft: rgba(63, 200, 230, 0.10);
  --accent-line: rgba(63, 200, 230, 0.42);

  --green: #2fd6c0;
  --amber: #f5c84a;
  --red: #ff5f9e;
  --gray: #7d768c;
  --scheduled: #3fc8e6;         
  --tier: #f5c84a;              

  --glow-red: 0 0 12px rgba(255, 47, 126, 0.4);
  --glow-dot: 0 0 8px currentColor;
  --brand-glow: drop-shadow(0 0 10px rgba(255, 47, 126, 0.35));

  
  --masthead-flare: linear-gradient(90deg, rgba(255, 47, 126, 0) 0%, rgba(255, 95, 158, 0.9) 18%, #ffd7e8 40%, #ffd7e8 60%, rgba(255, 95, 158, 0.9) 82%, rgba(255, 47, 126, 0) 100%);
  --masthead-flare-glow: linear-gradient(90deg, rgba(255, 47, 126, 0), rgba(255, 47, 126, 0.45) 30%, rgba(255, 95, 158, 0.55) 50%, rgba(255, 47, 126, 0.45) 70%, rgba(255, 47, 126, 0));
  --masthead-rule-top: none;
  --masthead-rule-bottom: none;

  --btn-primary-bg: transparent;
  --btn-primary-fg: #3fc8e6;
  --btn-primary-border: #3fc8e6;

  --chart-rgb: 63, 200, 230;    
  --chart-seg-stroke: none;

  --display: 'Michroma', sans-serif;      
  --body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;

  --sp: 24px;
  --radius: 3px;
  --maxw: 1240px;
}


@media (prefers-color-scheme: light) {
  :root:not([data-theme]) {
    color-scheme: light;
    --bg: #f4f1ea; --surface: #faf8f1; --surface-2: #ede8da;
    --line: #d9d2c2; --line-soft: #ddd6c6; --track: #e2dccb;
    --text: #16203a; --text-muted: #3e4760; --text-dim: #5d5748;
    --accent: #e04a56; --accent-text: #b5313e;
    --accent-soft: rgba(224, 74, 86, 0.08); --accent-line: rgba(224, 74, 86, 0.45);
    --green: #17705a; --amber: #8a6400; --red: #c22d47; --gray: #6f6a5c;
    --scheduled: #1f6e8a; --tier: #b5313e;
    --glow-red: none; --glow-dot: none; --brand-glow: none;
    --masthead-flare: none; --masthead-flare-glow: none;
    --masthead-rule-top: 2.5px solid #16203a; --masthead-rule-bottom: 1px solid #16203a;
    --btn-primary-bg: #16203a; --btn-primary-fg: #f4f1ea; --btn-primary-border: #16203a;
    --chart-rgb: 22, 32, 58; --chart-seg-stroke: #d9d2c2;
  }
}

:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f1ea; --surface: #faf8f1; --surface-2: #ede8da;
  --line: #d9d2c2; --line-soft: #ddd6c6; --track: #e2dccb;
  --text: #16203a; --text-muted: #3e4760; --text-dim: #5d5748;
  --accent: #e04a56; --accent-text: #b5313e;
  --accent-soft: rgba(224, 74, 86, 0.08); --accent-line: rgba(224, 74, 86, 0.45);
  --green: #17705a; --amber: #8a6400; --red: #c22d47; --gray: #6f6a5c;
  --scheduled: #1f6e8a; --tier: #b5313e;
  --glow-red: none; --glow-dot: none; --brand-glow: none;
  --masthead-flare: none; --masthead-flare-glow: none;
  --masthead-rule-top: 2.5px solid #16203a; --masthead-rule-bottom: 1px solid #16203a;
  --btn-primary-bg: #16203a; --btn-primary-fg: #f4f1ea; --btn-primary-border: #16203a;
  --chart-rgb: 22, 32, 58; --chart-seg-stroke: #d9d2c2;
}



* { box-sizing: border-box; }
html { height: 100%; }
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 2px;
}

a { color: var(--accent-text); text-decoration: none; }
a:hover { text-decoration: underline; }

.display {
  font-family: var(--display);
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: 0.14em;
}



.app { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }


.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--text); }
.brand svg { width: 24px; height: 24px; flex: none; filter: var(--brand-glow); }
.brand-name {
  font-family: var(--display);
  font-size: 13px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  line-height: 1;
}


.hzn-tabs { display: flex; align-items: center; gap: 4px; }
.hzn-tabs a {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
  padding: 6px 14px;
  border-radius: 999px;
  white-space: nowrap;
  transition: background 150ms ease-out, color 150ms ease-out;
}
.hzn-tabs a:hover { background: var(--surface-2); color: var(--text); text-decoration: none; }
.hzn-tabs a[aria-current="page"] { background: var(--accent-soft); color: var(--accent-text); }


.hzn-actions { display: inline-flex; align-items: center; gap: 10px; }
.sync-status { display: inline-flex; align-items: center; gap: 7px; }
.sync-text {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--text-dim); white-space: nowrap;
}
.hzn-action-btn {
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 12px; line-height: 1; min-width: 26px; height: 26px;
  background: none; border: 1px solid var(--line); border-radius: var(--radius);
  color: var(--text-muted); padding: 0 8px; cursor: pointer;
  transition: border-color 150ms ease-out, color 150ms ease-out;
}
.hzn-action-btn:hover, .hzn-action-btn[aria-current="page"] { border-color: var(--accent-line); color: var(--text); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }


.topbar {
  width: 100%; max-width: var(--maxw); margin: 0 auto;
  display: flex; align-items: baseline; gap: 16px;
  padding: 20px var(--sp) 0;
}
.topbar h1 {
  font-size: 20px; font-weight: 600; letter-spacing: -0.01em;
  margin: 0; flex-shrink: 0;
}
.topbar-spacer { flex: 1; }

.content {
  width: 100%;
  max-width: var(--maxw);
  margin: 0 auto;
  padding: var(--sp);
}



.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
}



.pulse-wrap { margin-bottom: 22px; }
.pulse {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 14px; flex-wrap: wrap;
  font-family: var(--mono); text-transform: uppercase;
}
.pulse-left { font-size: 11px; letter-spacing: 0.18em; color: var(--text-dim); }
.pulse-right { font-size: 11.5px; letter-spacing: 0.08em; color: var(--text-muted); }
.pulse-right .fl { color: var(--red); font-weight: 700; text-shadow: var(--glow-red); }
.pulse-right .sc { color: var(--scheduled); font-weight: 700; }

.pulse-bar { display: flex; height: 4px; margin: 10px 0 4px; background: var(--track); }
.pulse-bar i { display: block; height: 4px; }
.pulse-bar i.sched { background: repeating-linear-gradient(135deg, var(--red) 0 3px, transparent 3px 6px); }
.pulse-counts {
  display: flex; gap: 8px;
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.05em;
  text-transform: uppercase; color: var(--text-dim);
}



.pill, .chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  background: none; border: 0; padding: 0;
}
.pill::before, .chip.green::before, .chip.amber::before, .chip.red::before, .chip.gray::before {
  content: ''; width: 7px; height: 7px; background: currentColor; flex: none;
}
.pill.green, .chip.green { color: var(--green); }
.pill.amber, .chip.amber { color: var(--amber); }
.pill.red, .chip.red { color: var(--red); }
.pill.gray, .chip.gray { color: var(--gray); }
.chip.accent { color: var(--accent-text); }
.chip.outline {
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 2px 7px; color: var(--text-muted);
}
a.chip:hover { text-decoration: underline; }


.readonly-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-dim); background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 2px 8px; white-space: nowrap; vertical-align: middle;
}
.readonly-badge::before { content: '🔒'; }


.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot.green { background: var(--green); color: var(--green); box-shadow: var(--glow-dot); }
.dot.amber { background: var(--amber); color: var(--amber); box-shadow: var(--glow-dot); }
.dot.red { background: var(--red); color: var(--red); box-shadow: var(--glow-dot); }
.dot.gray { background: var(--gray); }


.tier-sup {
  font-family: var(--mono); font-size: 8.5px; letter-spacing: 0.08em;
  vertical-align: super; color: var(--tier); margin-left: 3px;
}

.code {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.02em;
  color: var(--text-muted);
}



.btn {
  font-family: var(--mono); font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.12em;
  background: none;
  color: var(--text-muted);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 8px 14px;
  cursor: pointer;
  transition: border-color 150ms ease-out, color 150ms ease-out;
}
.btn:hover { border-color: var(--accent-line); color: var(--accent-text); }
.btn.primary { background: var(--btn-primary-bg); border-color: var(--btn-primary-border); color: var(--btn-primary-fg); }
.btn.primary:hover { filter: brightness(1.12); }
.btn.quiet { border-color: transparent; color: var(--text-dim); }
.btn.quiet:hover { background: var(--surface-2); color: var(--text); }
.btn:disabled { opacity: 0.5; cursor: default; }

input[type="text"], input[type="search"], input[type="number"], textarea {
  font: inherit; font-size: 13px;
  color: var(--text);
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  padding: 7px 2px;
}
input:focus, textarea:focus { border-bottom-color: var(--accent); }
input::placeholder { color: var(--text-dim); }

select {
  font: inherit; font-size: 13px;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 7px 10px;
}
select option { background: var(--surface); }
input[type="checkbox"], input[type="range"] { accent-color: var(--accent); }



.table-wrap {
  overflow-x: auto;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
table.data { width: 100%; border-collapse: collapse; font-size: 12.5px; }

table.data.fixed { table-layout: fixed; }
table.data th {
  text-align: left;
  font-family: var(--mono);
  font-size: 10px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.16em;
  color: var(--text-dim);
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  background: var(--bg);
  position: sticky; top: 0;
}
table.data th .sort { opacity: 0.7; font-size: 10px; }
table.data td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--line-soft);
  vertical-align: middle;
}
table.data td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
table.data tbody tr { cursor: pointer; transition: background 120ms ease-out; }
table.data tbody tr:hover { background: var(--surface-2); }
table.data tbody tr:last-child td { border-bottom: none; }
.site-head td { background: var(--surface-2); font-weight: 600; cursor: default; }
.site-head:hover { background: var(--surface-2) !important; }


.t-red { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 700; color: var(--red); }
.t-amber { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--amber); font-weight: 400; }
.t-sched { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--scheduled); font-weight: 700; }
.t-dim { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--text-dim); font-weight: 400; }
.t-num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
table.data td.r, table.data th.r { text-align: right; }


table.data td.tip { cursor: help; }
table.data td.tip > span, table.data td.tip > a {
  border-bottom: 1px dotted var(--line);
  padding-bottom: 1px;
}
table.data td.tip:hover > span, table.data td.tip:focus-within > span { border-bottom-color: var(--text-dim); }

table.data td.tip > a { color: inherit; text-decoration: none; }
table.data td.tip > a:hover, table.data td.tip > a:focus-visible { border-bottom-color: var(--scheduled); }
table.data td.tip:focus-visible, table.data td.tip a:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; border-radius: 2px; }


.pulse [data-tip] { cursor: help; border-bottom: 1px dotted transparent; padding-bottom: 1px; }
.pulse [data-tip]:hover, .pulse [data-tip]:focus-visible { border-bottom-color: currentColor; }
.pulse [data-tip]:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; border-radius: 2px; }


.htip {
  position: fixed; z-index: 60; max-width: 320px;
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  padding: 8px 10px; font-size: 12px; line-height: 1.5;
  pointer-events: none; opacity: 0; transform: translateY(2px);
  transition: opacity 90ms ease-out, transform 90ms ease-out;
}
.htip.show { opacity: 1; transform: translateY(0); }
.htip .htip-def { color: var(--text-dim); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 5px; }
.htip ul { list-style: none; margin: 0; padding: 0; }
.htip li { display: flex; gap: 8px; justify-content: space-between; padding: 1px 0; }
.htip li .htip-name { font-family: var(--mono); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.htip li .htip-meta { color: var(--text-dim); font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.htip .htip-more { color: var(--text-dim); font-size: 10.5px; margin-top: 4px; }
.htip .htip-total { display: flex; justify-content: space-between; gap: 8px; margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--line); font-family: var(--mono); font-variant-numeric: tabular-nums; }


.vu { display: inline-flex; gap: 2.5px; align-items: flex-end; }
.vu i { width: 3px; height: 11px; }
.vu i.g { background: var(--green); }
.vu i.a { background: var(--amber); }
.vu i.r { background: var(--red); }
.vu i.n { background: var(--track); }



.drawer-scrim {
  position: fixed; inset: 0; z-index: 40;
  background: rgba(4, 5, 8, 0.55);
}
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 41;
  width: min(460px, 92vw);
  background: var(--surface);
  border-left: 1px solid var(--line);
  overflow-y: auto;
  padding: 26px;
}
.drawer h2 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
.drawer .close {
  position: absolute; top: 16px; right: 16px;
  background: none; border: none; cursor: pointer;
  color: var(--text-dim); font-size: 16px; padding: 6px; border-radius: var(--radius);
}
.drawer .close:hover { background: var(--surface-2); color: var(--text); }
.drawer-subhead {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--text-dim);
}
.whyreplace { margin: 14px 0; padding-top: 12px; border-top: 1px solid var(--line-soft); }
.whyreplace p { font-size: 13px; line-height: 1.5; }
.kv { display: grid; grid-template-columns: 132px 1fr; gap: 7px 12px; font-size: 13px; margin: 16px 0; }
.kv dt { color: var(--text-dim); }
.kv dd { margin: 0; }


.rel-h2 { font-size: 18px; font-weight: 600; margin: 0 0 16px; }

.dsi-primary:hover{filter:brightness(1.1)}
.dsi-secondary{background:transparent;color:var(--lh-text-muted,#b8c0cf);border:1px solid var(--lh-border,#2b303b)!important}
.dsi-card input{display:block;width:100%;box-sizing:border-box;margin-top:10px;padding:11px 14px;border-radius:10px;border:1px solid var(--lh-border,#2b303b);
  background:var(--lh-bg,#0c0d11);color:inherit;font:inherit;font-size:14px;text-align:center}
.dsi-code{letter-spacing:.4em;font-family:var(--lh-font-mono,monospace)}
.dsi-hint{color:var(--lh-text-dim,#8a93a6);font-size:12px;margin:14px 0 0;line-height:1.5}
.dsi-err{color:var(--lh-bad,#ff5a6a);font-size:13px;margin:10px 0 0}
.dsi-apps{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:16px 0 0}
.dsi-apps span{font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--lh-border,#2b303b);color:var(--lh-text-muted,#b8c0cf)}

  .bugdrop:focus, .bugdrop.drag { outline: none; border-color: var(--lh-accent, #2aa3e6); }
  .bugdrop-empty { text-align: center; font-size: 13px; font-weight: 600; color: var(--lh-text-muted, #a5adbb); }
  .bugdrop-empty span { display: block; margin-top: 4px; font-size: 11px; font-weight: 500; color: var(--lh-text-dim, #6d7684); }
  .bugprev { max-width: 100%; max-height: 240px; border-radius: 8px; display: block; }
  .bugfoot { display: flex; align-items: center; gap: 9px; margin-top: 14px; }
  .bugfoot .bugstatus { font-size: 12px; color: var(--lh-text-dim, #6d7684); margin-right: auto; }
  .bugbtn {
    background: none; border: 1px solid var(--lh-border, #2b303b); color: var(--lh-text-muted, #a5adbb);
    font: inherit; font-size: 12.5px; padding: 8px 13px; border-radius: 8px; cursor: pointer;
  }
  .bugbtn:hover { color: var(--lh-text, #f2f5f9); border-color: var(--lh-text-dim, #6d7684); }
  .bugbtn.primary {
    background: var(--lh-accent-soft, rgba(42,163,230,0.13));
    border-color: var(--lh-accent-line, rgba(42,163,230,0.38));
    color: var(--lh-accent, #2aa3e6); font-weight: 600;
  }
  .bugbtn.primary:hover { filter: brightness(1.15); color: var(--lh-accent, #2aa3e6); }
  .bugbtn:disabled { opacity: 0.7; cursor: default; }
  
  .relback {
    position: fixed; inset: 0; z-index: 2147483000;
    background: rgba(0, 0, 0, 0.5);
    display: none; align-items: center; justify-content: center; padding: 24px;
  }
  .relback.open { display: flex; }
  .relcard {
    width: min(620px, 100%); max-height: 88vh; overflow-y: auto;
    background: var(--lh-panel, #15171d);
    border: 1px solid var(--lh-border, #2b303b);
    border-radius: var(--lh-radius, 12px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
    padding: 18px 18px 4px;
  }
  .relcard .relhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .relcard h2 {
    margin: 0; font-size: 15px; font-weight: 700; color: var(--lh-text, #f2f5f9);
    font-family: var(--lh-font-display, 'Arial Narrow', sans-serif); letter-spacing: 0.03em;
  }
  .relclose {
    background: none; border: none; color: var(--lh-text-muted, #a5adbb); cursor: pointer;
    font-size: 15px; line-height: 1; padding: 4px;
  }
  .relclose:hover { color: var(--lh-text, #f2f5f9); }
  .rellist { padding-bottom: 4px; }
  .rel { border-bottom: 1px solid var(--lh-border-soft, #21252e); padding: 16px 0; }
  .rel:last-child { border-bottom: none; }
  .relrow { display: flex; align-items: baseline; gap: 12px; }
  .relver {
    font-family: var(--lh-font-display, 'Arial Narrow', sans-serif); font-style: italic; font-weight: 800; font-size: 18px;
    color: var(--lh-accent, #2aa3e6);
  }
  .reltitle { font-family: var(--lh-font-display, 'Arial Narrow', sans-serif); font-weight: 700; font-size: 15px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--lh-text, #f2f5f9); }
  .reldate { margin-left: auto; font-size: 12px; color: var(--lh-text-dim, #6d7684); font-variant-numeric: tabular-nums; }
  .relnotes { margin: 10px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
  .relnotes li { font-size: 13px; color: var(--lh-text-muted, #a5adbb); line-height: 1.5; }
  .prod {
    font-size: 9px; font-weight: 700; letter-spacing: 0.06em;
    padding: 1px 5px; margin-left: 5px; vertical-align: 2px;
    border-radius: var(--lh-radius-pill, 999px);
    color: var(--lh-warn, #f5c84a);
    background: rgba(245, 200, 74, 0.1);
    border: 1px solid rgba(245, 200, 74, 0.32);
    text-transform: uppercase;
  }
  
  @media (max-width: 920px) {
    
    .bar { display: flex; flex-wrap: wrap; justify-content: space-between; height: auto; row-gap: 8px; padding: calc(8px + env(safe-area-inset-top)) 14px 8px; }
    .tabs { order: 4; width: 100%; }
    .verChip { margin-left: 6px; }
    
    .barLeft { flex: 1 1 0; }
    .barRight { flex: none; }
    
    .switch { min-width: 0; }
    .switchBtn { min-width: 0; max-width: 100%; }
  }
  @media (max-width: 640px) {
    .email { display: none; }
    
    .mark .lh { display: none; }
    .mark .dot { display: none; }
    .mark .monogram { display: block; width: 18px; height: 20px; }
    
    .mark { margin-right: 4px; padding-right: 10px; align-self: stretch; align-items: center; }
    
    .bar:not(.minimal) { column-gap: 8px; padding-left: 10px; padding-right: 10px; }
    .switchBtn { padding: 5px 8px; }
    .verChip { font-size: 11px; letter-spacing: 0.02em; padding: 4px 8px; margin-left: 6px; }
  }
