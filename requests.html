*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

html { -webkit-text-size-adjust: 100%; }

body {

}

button, select, textarea, input { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--f-accent); outline-offset: 2px; }

.r-vh {

  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}

body:not(.booted) .r-shell,

.r-gate {

  gap: 16px;

}

.known-user .r-gate { display: none; }
.r-gate-title { margin: 0; font: var(--r-large-title); }
.r-gate-msg { margin: 0; max-width: 30ch; font: var(--r-body); color: var(--f-muted); }

.r-btn {

}

  font: var(--r-headline); color: var(--f-accent);
  background: none; border: 0; cursor: pointer;
}

.r-offline {
  display: none;
  padding: 8px calc(16px + env(safe-area-inset-right)) 8px calc(16px + env(safe-area-inset-left));
  padding-top: calc(8px + env(safe-area-inset-top));

}

.r-update {

}

.r-toolbar {
  position: sticky; top: 0; z-index: 40;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px;
  max-width: 720px; margin: 0 auto;
  min-height: calc(env(safe-area-inset-top) + var(--r-toolbar-h));
  padding: env(safe-area-inset-top) calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left));
  background: var(--f-bg);
}
.r-toolbar-leading { display: flex; align-items: center; min-width: 0; }
.r-toolbar-title {
  margin: 0; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;

}

.r-back {

}

.r-compose {

  color: #fff; background: var(--f-fill);
  border: 0; border-radius: 50%; cursor: pointer;
}

.r-compose-ico, .r-send-ico {

}

lh-nav[compact] { position: static; display: block; width: 44px; height: 44px; }
lh-nav[compact] { --lh-avatar-bg: #2c2c2e; --lh-avatar-fg: #ffffff; }
:root[data-theme='light'] lh-nav[compact] { --lh-avatar-bg: #e3e3e8; --lh-avatar-fg: #000000; }

.r-shell {
  max-width: 720px; margin: 0 auto;
  padding: 0 calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left));
}

.r-list-screen {
  display: flex; flex-direction: column;
  padding: 4px 0 calc(96px + env(safe-area-inset-bottom));
}

.r-picker { display: flex; align-items: center; gap: 12px; margin: 4px 0 12px; }
.r-picker-label { font: var(--r-subhead); color: var(--f-muted); }
.r-picker-select {
  flex: 1 1 auto; min-width: 0;
  min-height: var(--f-tap); padding: 0 12px;
  font: var(--r-body); font-size: 17px;
  color: var(--f-text); background: var(--f-field);
  border: 0; border-radius: 10px;
}

.r-stale, .r-loading {

  font: var(--r-footnote); color: var(--f-muted);
}
.r-loading { padding: 48px 0; font: var(--r-body); }
.r-note {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  margin: 8px 0 12px; padding: 12px 16px;
  text-align: center;
  background: var(--f-card); border-radius: var(--f-radius);
}
.r-note-text { margin: 0; font: var(--r-subhead); color: var(--f-muted); }

.r-empty { padding: 96px 16px 24px; text-align: center; }
.r-empty-text { margin: 0; font: var(--r-title2); color: var(--f-muted); }

.r-inbox { list-style: none; margin: 0 calc(-16px - env(safe-area-inset-right)) 0 calc(-16px - env(safe-area-inset-left)); padding: 0; }
.r-inbox-item { position: relative; }
.r-inbox-item:not(:last-child)::after {
  content: ''; position: absolute; left: 76px; right: 0; bottom: 0;
  height: 1px; transform: scaleY(0.5); transform-origin: bottom;
  background: var(--f-border);
}
.r-row {
  display: flex; align-items: center; gap: 10px;
  width: 100%; min-height: 76px;
  padding: 10px calc(16px + env(safe-area-inset-right)) 10px calc(4px + env(safe-area-inset-left));
  text-align: left; color: var(--f-text);
  background: none; border: 0; cursor: pointer;
}
.r-row:active { background: var(--f-card-hover); }
.r-dot { flex: 0 0 12px; display: flex; align-items: center; justify-content: center; }
.r-row.is-unread .r-dot::before {
  content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--f-accent);
}
.r-row-text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.r-row-top { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.r-row-title {
  flex: 1 1 auto; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font: var(--r-headline);
}
.r-row-date { flex: none; font: var(--r-subhead); color: var(--f-muted); }
.r-chev { flex: none; font-size: 22px; line-height: 1; color: var(--f-dim); transition: transform 0.15s; }
.r-row-preview {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font: var(--r-subhead); color: var(--f-muted);
}

.r-avatar {
  flex: none;
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
  border-radius: 50%;
  color: #fff; background: var(--r-avatar);
  font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase;
  overflow: hidden;
}
.r-avatar.is-row { width: 40px; height: 40px; font-size: 12px; line-height: 1.05; }
.r-avatar.is-row.is-two { font-size: 10px; }
.r-avatar.is-small { width: 28px; height: 28px; font-size: 9px; line-height: 1; }
.r-avatar.is-small.is-two { font-size: 7.5px; }
.r-avatar-line { display: block; }

.r-avatar.r-av-0 { background: var(--r-av-0); }
.r-avatar.r-av-1 { background: var(--r-av-1); }
.r-avatar.r-av-2 { background: var(--r-av-2); }
.r-avatar.r-av-3 { background: var(--r-av-3); }
.r-avatar.r-av-4 { background: var(--r-av-4); }
.r-avatar.r-av-5 { background: var(--r-av-5); }
.r-avatar.r-av-6 { background: var(--r-av-6); }
.r-avatar.r-av-7 { background: var(--r-av-7); }
.r-avatar.r-av-8 { background: var(--r-av-8); }
.r-avatar.r-av-9 { background: var(--r-av-9); }

.r-done-toggle {
  display: flex; align-items: center; gap: 8px;
  width: 100%; min-height: 52px; margin-top: 16px; padding: 0 4px;
  font: var(--r-headline); color: var(--f-muted);
  background: none; border: 0; cursor: pointer;
}
.r-done-label { flex: 1 1 auto; text-align: left; }
.r-done-count { font-weight: 400; font-variant-numeric: tabular-nums; }
.r-done-toggle.is-open .r-chev { transform: rotate(90deg); }

.r-cta-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; justify-content: center;
  padding: 12px calc(16px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  background: var(--f-glass);

  backdrop-filter: blur(20px) saturate(180%);
  border-top: 1px solid var(--f-glass-edge);
}
.r-cta {
  width: 100%; max-width: 688px; min-height: 52px;

  border: 0; border-radius: 14px; cursor: pointer;

.r-convo {
  display: flex; flex-direction: column;
  min-height: calc(100dvh - env(safe-area-inset-top) - var(--r-toolbar-h));

.r-head {
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-width: var(--f-tap); min-height: var(--f-tap); max-width: 48vw; padding: 2px 6px;
  color: var(--f-text); background: none; border: 0; border-radius: 10px; cursor: pointer;

.r-kv {

  padding: 0 calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left));

.r-composer {
  position: sticky; bottom: 0; z-index: 20;
  margin: 0 calc(-16px - env(safe-area-inset-right)) 0 calc(-16px - env(safe-area-inset-left));
  padding: 8px calc(12px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
  background: var(--f-glass);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border-top: 1px solid var(--f-glass-edge);
}
.r-composer.is-kb { padding-bottom: 8px; } 
.r-composer-row { display: flex; align-items: flex-end; gap: 6px; }
.r-plus {
  flex: none; display: inline-flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; padding: 0;
  font-size: 28px; font-weight: 300; line-height: 1;
  color: var(--f-muted); background: var(--f-card-2);
  border: 0; border-radius: 50%; cursor: pointer;
}
.r-plus:disabled, .r-plus[aria-disabled='true'] { color: var(--f-border); }
.r-pill {
  flex: 1 1 auto; min-width: 0;
  display: flex; align-items: flex-end;
  min-height: 44px; padding: 5px 5px 5px 14px;
  background: var(--f-bg);
  border: 1px solid var(--f-border); border-radius: 22px;
}
.r-input {
  flex: 1 1 auto; min-width: 0;
  min-height: 32px; max-height: 128px; 
  margin: 0; padding: 5px 0;
  font: var(--r-body); font-size: 17px;
  color: var(--f-text); background: none;
  border: 0; outline: none; resize: none;
}
.r-input::placeholder { color: var(--f-dim); }
.r-send {
  position: relative; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; margin-left: 6px; padding: 0;
  color: #fff; background: var(--f-fill);
  border: 0; border-radius: 50%; cursor: pointer;
}
.r-send::before { content: ''; position: absolute; inset: -6px; } 
.r-send:disabled { opacity: 0.5; cursor: default; }
.r-send-ico { width: 18px; height: 18px; stroke-width: 2.6; }
.r-file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.r-composer-note { margin: 6px 4px 0; font: var(--r-footnote); color: var(--f-muted); text-align: center; }

.r-tray { display: flex; gap: 8px; padding: 4px 0 8px 50px; overflow-x: auto; }
.r-tray-item { position: relative; flex: none; width: 64px; height: 64px; }
.r-tray-img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
.r-tray-x {
  position: absolute; top: -10px; right: -10px;
  display: inline-flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; padding: 0;
  background: none; border: 0; cursor: pointer;
}
.r-tray-x span {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 50%;
  font-size: 15px; font-weight: 700; line-height: 1;
  color: #fff; background: rgba(0, 0, 0, 0.6);
}

.r-viewer {
  position: fixed; inset: 0;
  width: 100vw; height: 100dvh; max-width: none; max-height: none;
  margin: 0; padding: 0; border: 0;
  background: #000; color: #fff;
}
.r-viewer::backdrop { background: #000; }
.r-viewer-img { display: block; width: 100%; height: 100%; object-fit: contain; }
.r-viewer-done {
  position: absolute; z-index: 1;
  top: calc(8px + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left));
  min-height: var(--f-tap); padding: 0 16px;
  font: var(--r-headline); color: #fff;
  background: rgba(0, 0, 0, 0.55); border: 0; border-radius: 999px; cursor: pointer;
}

@media (min-width: 768px) and (min-height: 500px) {
  .r-avatar.is-row { width: 44px; height: 44px; font-size: 13px; }
  .r-inbox-item:not(:last-child)::after { left: 80px; }
}

@media (min-width: 1024px) and (min-height: 500px) {
  .r-toolbar, .r-shell { max-width: 1200px; }

  .r-split {
    --r-pane-top: calc(env(safe-area-inset-top) + var(--r-toolbar-h));
    display: grid;
    grid-template-columns: clamp(300px, 34%, 380px) minmax(0, 1fr);
    gap: 24px; align-items: start;
  }
  .r-split-list { min-width: 0; }
  .r-split-list .r-list-screen { padding-bottom: 0; }
  .r-split-list .r-inbox { margin: 0; }
  .r-split-list .r-row { padding-left: 4px; padding-right: 12px; border-radius: 12px; }
  .r-split-list .r-row.is-selected { color: #fff; background: var(--f-fill); }
  .r-split-list .r-row.is-selected .r-row-date,
  .r-split-list .r-row.is-selected .r-row-preview,
  .r-split-list .r-row.is-selected .r-chev { color: rgba(255, 255, 255, 0.85); }
  .r-split-list .r-row.is-selected .r-dot::before { background: #fff; }
  .r-split-list .r-cta-bar {
    position: sticky; bottom: 0;
    padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
    background: var(--f-bg); border-top: 0;
    -webkit-backdrop-filter: none; backdrop-filter: none;
  }

  .r-pane {
    position: sticky; top: var(--r-pane-top);
    height: calc(100dvh - var(--r-pane-top) - 12px - env(safe-area-inset-bottom));
    overflow-y: auto; overscroll-behavior: contain;
    background: var(--f-card); border-radius: var(--f-radius-lg);
  }
  .r-pane .r-convo { min-height: 100%; padding: 0 16px; }
  .r-pane .r-head-slot {
    position: sticky; top: 0; z-index: 21;
    margin: 0 -16px; padding: 6px 16px;
    background: var(--f-card);
    border-bottom: 1px solid var(--f-border-soft);
  }
  .r-pane .r-head { max-width: 80%; }
  .r-pane .r-head-title { font: var(--r-footnote); font-weight: 600; }
  .r-pane .r-details { background: var(--f-bg); }
  .r-pane .r-composer { margin-left: -16px; margin-right: -16px; padding-left: 16px; padding-right: 16px; }
  .r-pane .r-to { margin-left: -16px; margin-right: -16px; padding-left: 16px; padding-right: 16px; }
  .r-pane .r-composer { padding-bottom: 12px; background: var(--f-card); }
  .r-pane .r-pill { background: var(--f-card); }
  .r-pane-empty {
    margin: 0; padding: 120px 16px 0;
    text-align: center; font: var(--r-body); color: var(--f-muted);
  }
}

@media (min-width: 1024px) and (min-height: 500px) and (hover: hover) {
  .r-split-list .r-row:not(.is-selected):hover { background: var(--f-card-hover); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
