:root {
  
  --lh-accent: #2aa3e6;
  --lh-accent-soft: rgba(42, 163, 230, 0.13);

  --lh-good: #2fd6c0;
  --lh-info: #4296f0;

  --lh-font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

  --lh-space-1: 4px;

  --lh-space-5: 24px;
  --lh-space-6: 32px;
}

:root[data-theme='light'] {
  
  --lh-accent: #0f7cb8;
  --lh-accent-soft: rgba(15, 124, 184, 0.10);
  --lh-accent-line: rgba(15, 124, 184, 0.35);

  
  --lh-bg: #f4f6f9;
  --lh-panel: #ffffff;
  --lh-panel-2: #eef1f5;
  --lh-panel-hover: #e4e9f0;
  --lh-border: #cdd4de;
  --lh-border-soft: #e2e7ee;

  
  --lh-text: #10131a;
  --lh-text-muted: #4a5261;
  --lh-text-dim: #6b7382;

  
  --lh-good: #0a8f7d;
  --lh-info: #1b6fd0;
  --lh-warn: #8a5d00;
  --lh-alert: #b8551a;
  --lh-bad: #c62a6a;

  
  --lh-shadow: 0 1px 2px rgba(16, 19, 26, 0.06), 0 12px 32px rgba(16, 19, 26, 0.10);

  color-scheme: light;
}



:root {
  --f-bg: #000000;
  --f-card: #1c1c1e;
  --f-card-2: #2c2c2e;
  --f-card-hover: #2c2c2e;
  --f-border: #38383a;
  --f-border-soft: #2c2c2e;
  --f-text: #ffffff;
  --f-muted: #aeaeb2;
  --f-dim: #8e8e93;
  --f-fill: #0f7cb8;
  --f-field: #1c1c1e;
  --f-glass: rgba(30, 30, 32, 0.82);
  --f-glass-edge: rgba(255, 255, 255, 0.10);
  --f-accent: var(--lh-accent, #2aa3e6);
  --f-accent-soft: var(--lh-accent-soft, rgba(42, 163, 230, 0.13));
  --f-warn: var(--lh-warn, #f5c84a);
  --f-radius: 14px;
  --f-radius-lg: 18px;
  --f-tap: 44px;

  --p-red: #ff6961;
  --p-green: #30d158;
  --p-toolbar-h: 56px;
  --p-field: #2c2c2e;
  --p-row: #2c2c2e; 
  --p-ring-track: #2c2c2e;
  
  --p-tint-fg: #4fb6ec;
  --p-tint-bg: #12293a;

  
  --p-chip-needed-fg: #f5c84a;
  --p-chip-needed-bg: #3a3014;
  --p-chip-review-fg: #64c4f4;
  --p-chip-review-bg: #13324a;
  --p-chip-complete-fg: #4cd471;
  --p-chip-complete-bg: #163a20;
  --p-chip-expired-fg: #ff6961;
  --p-chip-expired-bg: #3a1513;
  
  --p-chip-rejected-fg: #ff6961;
  --p-chip-rejected-bg: #3a1513;
  
  --p-chip-not-required-fg: #aeaeb2;
  --p-chip-not-required-bg: #2c2c2e;

  
  --p-font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
  
  --p-display: 'Barlow Condensed', 'Arial Narrow', var(--p-font);
  --p-display-title: 500 40px/1.05 var(--p-display);
  --p-display-card: 500 24px/1.1 var(--p-display);
  --p-large-title: 700 34px/41px var(--p-font);
  --p-title1: 700 28px/34px var(--p-font);
  --p-title3: 600 20px/25px var(--p-font);
  --p-headline: 600 17px/22px var(--p-font);
  --p-body: 400 17px/22px var(--p-font);
  --p-subhead: 400 15px/20px var(--p-font);
  --p-footnote: 400 13px/18px var(--p-font);
  --p-caption: 400 12px/16px var(--p-font);

  color-scheme: dark;
}
:root[data-theme='light'] {
  --f-bg: #f2f2f7;
  --f-card: #ffffff;
  --f-card-2: #e9e9eb;
  --f-card-hover: #e5e5ea;
  --f-border: #c6c6c8;
  --f-border-soft: #e5e5ea;
  --f-text: #000000;
  --f-muted: #5e5e63;
  --f-dim: #6e6e73;
  --f-fill: #0f7cb8;
  --f-field: #e3e3e8;
  --f-glass: rgba(249, 249, 251, 0.85);
  --f-glass-edge: rgba(0, 0, 0, 0.08);
  --f-accent: var(--lh-accent, #0f7cb8);
  --f-accent-soft: var(--lh-accent-soft, rgba(15, 124, 184, 0.10));
  --p-red: #d70015;
  --p-green: #1f8a3c;
  --p-field: #ffffff;
  --p-row: #f2f2f7;
  --p-ring-track: #dcdce1;
  --p-tint-fg: #0b6194;
  --p-tint-bg: #e1eff8;

  --p-chip-needed-fg: #7a5000;
  --p-chip-needed-bg: #fbf0d0;
  --p-chip-review-fg: #0b6194;
  --p-chip-review-bg: #e1eff8;
  --p-chip-complete-fg: #146c2e;
  --p-chip-complete-bg: #dff3e4;
  --p-chip-expired-fg: #b3001b;
  --p-chip-expired-bg: #fde3e3;
  --p-chip-rejected-fg: #b3001b;
  --p-chip-rejected-bg: #fde3e3;
  --p-chip-not-required-fg: #5e5e63;
  --p-chip-not-required-bg: #e9e9eb;

  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100dvh;
  font: var(--p-body);
  color: var(--f-text);
  background: var(--f-bg);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
}

button, select, textarea, input { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
a { color: var(--f-accent); -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--f-accent); outline-offset: 2px; }

body:not(.booted) .p-shell,
body:not(.booted) .p-toolbar { visibility: hidden; }

.p-gate {
  position: fixed; inset: 0; z-index: 400;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px;
  padding: calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right))
           calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
  text-align: center;
  background: var(--f-bg);
}
.p-gate.is-hidden { display: none; }
.p-gate-logo { display: block; width: min(220px, 60vw); height: auto; }
.p-gate-msg { margin: 0; max-width: 32ch; font: var(--p-body); color: var(--f-muted); }

.p-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 50px; padding: 0 24px;
  font: var(--p-headline);
  color: #fff; background: var(--f-fill);
  border: 0; border-radius: var(--f-radius); cursor: pointer;
  text-decoration: none;
}
.p-btn:active { filter: brightness(0.9); }
.p-btn:disabled { opacity: 0.45; cursor: default; filter: none; }
.p-btn-wide { width: 100%; }
.p-btn-tinted { color: var(--p-tint-fg); background: var(--p-tint-bg); }
.p-link {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: var(--f-tap); min-width: var(--f-tap); padding: 0 12px;
  font: var(--p-headline); font-weight: 500; color: var(--f-accent);
  background: none; border: 0; cursor: pointer; text-decoration: none;
}
.p-link:disabled { opacity: 0.45; cursor: default; }

.p-offline {
  display: none;
  padding: 8px calc(16px + env(safe-area-inset-right)) 8px calc(16px + env(safe-area-inset-left));
  padding-top: calc(8px + env(safe-area-inset-top));
  font: var(--p-footnote); font-weight: 600; text-align: center;
  color: #000; background: var(--f-warn);
}
body.is-offline .p-offline { display: block; }

.p-toolbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin: 0 auto;
  min-height: calc(env(safe-area-inset-top) + var(--p-toolbar-h));
  padding: env(safe-area-inset-top) calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left));
  background: var(--f-bg);
}
.p-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.p-brand-logo { display: block; height: 30px; width: auto; flex: none; }
.p-brand-name { font: 500 20px/1 var(--p-display); text-transform: uppercase; letter-spacing: 0.1em; white-space: nowrap; padding-top: 2px; }

body[data-screen='signin'] .p-brand { visibility: hidden; }

.p-theme-btn {
  flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; padding: 0;
  color: var(--f-text); background: var(--f-card-2);
  border: 0; border-radius: 50%; cursor: pointer;
}
.p-theme-btn:active { background: var(--f-border); }
.p-theme-btn:focus-visible { outline: 2px solid var(--f-accent); outline-offset: 2px; }
.p-theme-ico {
  display: none; width: 22px; height: 22px;
  fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}
:root[data-theme='dark'] .p-theme-sun { display: block; }
:root[data-theme='light'] .p-theme-moon { display: block; }

.p-shell {
  margin: 0 auto;
  padding: 0 calc(16px + env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
}

.p-signin {
  display: flex; align-items: center; justify-content: center;
  min-height: calc(100dvh - env(safe-area-inset-top) - var(--p-toolbar-h) - 32px - env(safe-area-inset-bottom));
  padding: 8px 0 24px;
}
.p-signin-card {
  display: flex; flex-direction: column; align-items: center;
  width: 100%; max-width: 400px;
  text-align: center;
}
.p-signin-logo { display: block; width: min(300px, 78vw); height: auto; margin: 0 auto 22px; }

:root[data-theme='dark'] .p-logo, :root[data-theme='dark'] .p-signin-logo { filter: brightness(0) invert(1); opacity: 0.94; }

.p-signin-title {
  margin: 0 0 28px; font: var(--p-display-title); text-transform: uppercase;
  letter-spacing: 0.12em; text-wrap: balance;
  padding-left: calc(0.12em + min(12px, 3.12vw));
}
.p-signin-form { display: flex; flex-direction: column; gap: 12px; width: 100%; text-align: left; }
.p-label { font: var(--p-subhead); font-weight: 600; color: var(--f-muted); padding: 0 4px; }
.p-input {
  width: 100%; height: 50px; padding: 0 16px;
  font: var(--p-body); font-size: 17px;
  color: var(--f-text); background: var(--p-field);
  border: 0; border-radius: 12px; outline: none;
}
.p-input:focus { box-shadow: inset 0 0 0 2px var(--f-accent); }
.p-input::placeholder { color: var(--f-dim); }
.p-signin-msg { margin: 0; padding: 0 4px; font: var(--p-subhead); color: var(--f-muted); }
.p-signin-msg.is-error { color: var(--p-red); }
.p-signin-to { margin: 0; padding: 0 4px; font: var(--p-subhead); color: var(--f-muted); overflow-wrap: anywhere; }
.p-signin-links { display: flex; justify-content: space-between; gap: 8px; margin: 0 -12px; }

.p-code {
  position: relative;
  display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px;
}
.p-code-cell {
  display: flex; align-items: center; justify-content: center;
  height: 58px;
  font: 600 28px/1 var(--p-font); font-variant-numeric: tabular-nums;
  color: var(--f-text); background: var(--p-field);
  border-radius: 12px;
}
.p-code.is-focused .p-code-cell.is-active { box-shadow: inset 0 0 0 2px var(--f-accent); }
.p-code-input {
  position: absolute; inset: 0; width: 100%; height: 100%;
  padding: 0; margin: 0;
  font-size: 17px; letter-spacing: 1em;
  color: transparent; -webkit-text-fill-color: transparent; caret-color: transparent;
  background: transparent; border: 0; outline: none;
  cursor: text;
}
.p-code-input::selection { background: transparent; }

.p-choose-title { margin: 0; padding: 0 4px; font: var(--p-title3); }
.p-companies { display: flex; flex-direction: column; gap: 10px; }
.p-company-btn { gap: 10px; padding: 0 18px; text-align: center; }
.p-company-name { min-width: 0; overflow-wrap: anywhere; }
.p-company-btn.is-current:disabled { opacity: 1; color: var(--f-muted); background: var(--f-card-2); }
.p-company-current { flex: none; display: inline-flex; align-items: center; gap: 4px; font: var(--p-footnote); font-weight: 600; }
.p-company-check {
  width: 16px; height: 16px;
  fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
}

.p-summary { padding: 4px 0 8px; }
.p-title { margin: 0; font: var(--p-display-title); text-transform: uppercase; letter-spacing: 0.1em; }
.p-vendor { margin: 2px 0 0; font: var(--p-body); color: var(--f-muted); overflow-wrap: anywhere; }

.p-ring { display: flex; align-items: center; gap: 14px; margin-top: 18px; }
.p-ring-svg { flex: none; width: 56px; height: 56px; }
.p-ring-track { stroke: var(--p-ring-track); }
.p-ring-arc { stroke: var(--f-accent); }
.p-ring.is-done .p-ring-arc { stroke: var(--p-green); }
.p-ring-check { stroke: var(--p-green); }
.p-ring-label { font: var(--p-headline); font-variant-numeric: tabular-nums; }

.p-facts, .p-summary-signout, .p-summary-switch { display: none; }

.p-grid {
  list-style: none; margin: 20px 0 0; padding: 0;
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px;
}

.p-card {
  position: relative;
  display: flex; flex-direction: column; gap: 8px;
  padding: 16px;
  background: var(--f-card);
  border-radius: var(--f-radius-lg);
}
.p-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }

.p-card-title { margin: 0; font: var(--p-display-card); text-transform: uppercase; letter-spacing: 0.06em; min-width: 0; overflow-wrap: anywhere; }
.p-card-hint { margin: 0; font: var(--p-footnote); color: var(--f-muted); }
.p-card-date { margin: 0; font: var(--p-footnote); font-weight: 600; color: var(--f-muted); }

.p-card-expiry { margin: 0; font: var(--p-footnote); font-weight: 600; }
.p-card-expiry.is-soon { color: var(--f-warn); }
.p-card-expiry.is-expired { color: var(--p-red); }

.p-card-reason { display: flex; flex-direction: column; gap: 2px; margin: 0; }
.p-card-reason-lead { margin: 0; font: var(--p-footnote); font-weight: 600; color: var(--p-red); }
.p-card-reason-text { margin: 0; font: var(--p-subhead); color: var(--f-text); white-space: pre-line; overflow-wrap: anywhere; }
.p-card-foot { display: flex; flex-direction: column; gap: 4px; margin-top: auto; padding-top: 4px; }
.p-card-action { width: 100%; }

.p-card.is-not-required .p-card-title { color: var(--f-muted); }
.p-card-note { margin: 0; padding: 4px 0; font: var(--p-footnote); color: var(--f-muted); }
.p-template {
  display: inline-flex; align-items: center; align-self: flex-start;
  min-height: var(--f-tap);
  font: var(--p-subhead); font-weight: 600; color: var(--f-accent); text-decoration: none;
}

.p-chip {
  flex: none;
  display: inline-flex; align-items: center; gap: 4px;
  min-height: 26px; padding: 0 10px;
  font: 600 13px/18px var(--p-font); white-space: nowrap;
  border-radius: 999px;
}
.p-chip.is-needed { color: var(--p-chip-needed-fg); background: var(--p-chip-needed-bg); }
.p-chip.is-review { color: var(--p-chip-review-fg); background: var(--p-chip-review-bg); }
.p-chip.is-complete { color: var(--p-chip-complete-fg); background: var(--p-chip-complete-bg); }
.p-chip.is-expired { color: var(--p-chip-expired-fg); background: var(--p-chip-expired-bg); }
.p-chip.is-rejected { color: var(--p-chip-rejected-fg); background: var(--p-chip-rejected-bg); }
.p-chip.is-not-required { color: var(--p-chip-not-required-fg); background: var(--p-chip-not-required-bg); }
.p-chip-ico {
  width: 14px; height: 14px;
  fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
}

.p-files { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.p-file {
  display: flex; align-items: center; gap: 10px;
  min-height: 52px; padding: 6px 12px 6px 10px;
  color: var(--f-text); background: var(--p-row);
  border-radius: 12px; text-decoration: none;
}
a.p-file:active { filter: brightness(0.92); }
.p-file-ico, .p-chosen-ico {
  flex: none; width: 24px; height: 24px; color: var(--f-accent);
  fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
}
.p-file-text, .p-chosen-text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.p-file-name, .p-chosen-name {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font: var(--p-subhead); font-weight: 500;
}
.p-file-meta, .p-chosen-size { font: var(--p-caption); color: var(--f-muted); font-variant-numeric: tabular-nums; }

.p-drop-hint {
  position: absolute; inset: 0; z-index: 2;
  display: none; align-items: center; justify-content: center;
  font: var(--p-headline); color: var(--f-accent);
  background: var(--f-glass);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  border: 2px dashed var(--f-accent);
  border-radius: inherit;
  pointer-events: none;
}
.p-card.is-over .p-drop-hint,
.p-other.is-over .p-drop-hint { display: flex; }

.p-other { position: relative; margin-top: 28px; border-radius: var(--f-radius-lg); }
.p-section-title {
  margin: 0 0 8px; padding: 0 4px;
  font: var(--p-footnote); font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase;
  color: var(--f-muted);
}
.p-other-body {
  display: flex; flex-direction: column; gap: 4px;
  padding: 12px 12px 4px;
  background: var(--f-card); border-radius: var(--f-radius-lg);
}
.p-other-body .p-files { margin: 0; }
.p-other-none { margin: 0; padding: 8px 4px; font: var(--p-subhead); color: var(--f-muted); }
.p-other-action { align-self: flex-start; margin-left: -8px; padding: 0 8px; }

.p-foot {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  margin-top: 32px; text-align: center;
}
.p-foot-contact, .p-foot-ap { margin: 0; font: var(--p-subhead); color: var(--f-muted); }
